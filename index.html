<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=6" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=6" />
    <link rel="icon" type="image/png" href="/favicon.png?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TripVerse — AI Trip Planner &amp; Route-based Place Listings</title>
    <meta name="description" content="Draft day-by-day itineraries and budget estimates. Geoapify driving routes and nearby OpenStreetMap place listings are provided when available; confirm trip details before travel." />
    <meta name="keywords" content="TripVerse, road trip planner, Geoapify routing, OpenStreetMap places, AI travel itinerary, trip budget estimates" />
    <meta name="author" content="TripVerse Platform Team" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- Android & PWA Meta -->
    <meta name="theme-color" content="#2D5A3D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="TripVerse" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Instant Pre-hydration Theme Initializer -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tripverse_theme');
          var d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) {
            document.documentElement.classList.add('dark');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#070C16');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Identity Services (GIS) for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- iOS Apple Web App & Bookmark Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripVerse" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />
    <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png?v=6" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png?v=6" />
    <link rel="apple-touch-startup-image" href="/apple-splash-screen.png?v=6" />

    <!-- Windows & Tile Meta -->
    <meta name="msapplication-TileColor" content="#2D5A3D" />
    <meta name="msapplication-TileImage" content="/icons/icon-512.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://tripverse-pied.vercel.app/" />

    <!-- Open Graph for Social Sharing & Previews (WhatsApp, X, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tripverse-pied.vercel.app/" />
    <meta property="og:site_name" content="TripVerse" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="TripVerse — AI Trip Planner &amp; Route-based Place Listings" />
    <meta property="og:description" content="Draft trip itineraries and budget estimates. Live driving routes and nearby map listings are available when configured; always confirm details before travelling." />
    <meta property="og:image" content="https://tripverse-pied.vercel.app/icons/icon-512.png?v=6" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="TripVerse Official Public Release 2.0" />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TripVerseApp" />
    <meta name="twitter:title" content="TripVerse — AI Trip Planner" />
    <meta name="twitter:description" content="Draft trip itineraries and budget estimates, with driving routes and map listings when available." />
    <meta name="twitter:image" content="https://tripverse-pied.vercel.app/icons/icon-512.png?v=5" />

    <!-- Google Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TripVerse",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Travel planning app with suggested itineraries, budget estimates, and driving routes and map listings when available.",
      "url": "https://tripverse-pied.vercel.app/"
    }
    </script>

    <!-- Google Fonts: Sora (headings) and Plus Jakarta Sans (body & UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..700;1,300..700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-[#F4F6F2] text-[#152A1C] antialiased selection:bg-[#2D5A3D] selection:text-white font-sans overflow-x-clip">
    <div id="root">
      <!-- Pre-hydration luxury splash screen (theme-adaptive match with native splash) -->
      <div id="pre-app-splash" style="position:fixed;inset:0;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity 0.35s cubic-bezier(0.16,1,0.3,1);">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;">
          <div class="pre-splash-aura" style="position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, rgba(45,90,61,0.12) 0%, rgba(45,90,61,0) 70%);filter:blur(16px);animation:tvPreAura 2s ease-in-out infinite;"></div>
          <div class="pre-splash-card" style="position:relative;width:112px;height:112px;display:flex;align-items:center;justify-content:center;border-radius:28px;background:#FFFFFF;box-shadow:0 20px 48px -12px rgba(45,90,61,0.18), 0 0 0 1px rgba(45,90,61,0.06);animation:tvPrePulse 1.8s cubic-bezier(0.2,0.8,0.2,1) infinite;">
            <img src="/tripverse-mark-cropped.png" style="width:82px;height:auto;image-rendering:-webkit-optimize-contrast;transform:translateZ(0);" alt="TripVerse" />
          </div>
        </div>
        <div class="pre-splash-title" style="margin-top:22px;font-family:'Sora',system-ui,sans-serif;font-weight:900;font-size:28px;letter-spacing:-0.5px;color:#0B2545;text-align:center;">
          <span class="pre-splash-brand-trip">Trip</span><span style="color:#2D5A3D;" class="pre-splash-brand-verse">Verse</span>
        </div>
        <div class="pre-splash-tagline" style="margin-top:6px;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:600;font-size:12px;letter-spacing:0.3px;color:#64748B;text-align:center;">
          Plan Smarter. Travel Further.
        </div>
      </div>
      <style>
        @keyframes tvPrePulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.035); }
        }
        @keyframes tvPreAura {
          0%, 100% { transform: scale(0.9); opacity: 0.6; }
          50% { transform: scale(1.15); opacity: 1; }
        }
        html.dark #pre-app-splash {
          background: #070C16 !important;
        }
        html.dark .pre-splash-card {
          background: #0E1726 !important;
          box-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08) !important;
        }
        html.dark .pre-splash-aura {
          background: radial-gradient(circle, rgba(16, 185, 129, 0.22) 0%, rgba(7, 12, 22, 0) 70%) !important;
        }
        html.dark .pre-splash-brand-trip {
          color: #F8FAFC !important;
        }
        html.dark .pre-splash-brand-verse {
          color: #34D399 !important;
        }
        html.dark .pre-splash-tagline {
          color: #94A3B8 !important;
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
