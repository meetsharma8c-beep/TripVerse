    <meta name="application-name" content="TripVerse" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://tripverse-pied.vercel.app/" />

    <!-- Open Graph for Social Sharing & Previews (WhatsApp, X, LinkedIn, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tripverse-pied.vercel.app/" />
    <meta property="og:site_name" content="TripVerse" />

    <meta name="twitter:site" content="@TripVerseApp" />
    <meta name="twitter:title" content="TripVerse — AI Trip Planner" />
    <meta name="twitter:description" content="Draft trip itineraries and budget estimates, with driving routes and map listings when available." />
    <meta name="twitter:image" content="https://tripverse-pied.vercel.app/icons/icon-512.png?v=5" />

    <!-- Google Schema.org Structured Data -->

      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TripVerse",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "Travel planning app with suggested itineraries, budget estimates, and driving routes and map listings when available.",
      "url": "https://tripverse-pied.vercel.app/"
    }

    <!-- Google Fonts: Sora (headings) and Plus Jakarta Sans (body & UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..700;1,300..700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-[#F4F6F2] text-[#152A1C] antialiased selection:bg-[#2D5A3D] selection:text-white font-sans overflow-x-clip">
    <div id="root">
      <!-- Pre-hydration light splash fallback -->
      <div style="position:fixed;inset:0;background:#F4F6F2;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;">
        <div style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:#FFFFFF;border:1px solid rgba(226,235,225,0.9);box-shadow:0 12px 32px rgba(45,90,61,0.08);animation:tvPrePulse 1.8s ease-in-out infinite;">
          <img src="/tripverse-mark.svg" style="width:68px;height:auto;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;" alt="TripVerse" />
        </div>
        <div style="margin-top:16px;font-family:'Sora',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.5px;color:#152A1C;">
          <span>Trip</span><span style="color:#2D5A3D;">Verse</span>
        </div>
      </div>
      <style>
        @keyframes tvPrePulse {
          0%, 100% { transform: scale(1); opacity: 0.95; }
          50% { transform: scale(1.05); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
