
<svg xmlns="http://www.w3.org/2000/svg" viewBox="65 -5 195 155" width="512" height="512">
  <defs>
    <!-- Background luxury glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#113663" />
      <stop offset="65%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#05152A" />
    </radialGradient>
    
    <!-- Ambient emerald backlight behind logo -->
    <radialGradient id="logoBacklight" cx="48%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#00B574" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#00B574" stop-opacity="0" />
    </radialGradient>

    <!-- Main Gradient: Top-left vibrant mint to bottom-right jade -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#00F09C" />
      <stop offset="30%" stop-color="#00D287" />
      <stop offset="70%" stop-color="#00A86B" />
      <stop offset="100%" stop-color="#00774C" />
    </linearGradient>

    <!-- Swoosh Arc Gradient -->
