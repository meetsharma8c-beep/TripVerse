      <stop offset="0%" stop-color="#009E65" />
      <stop offset="50%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#38FFBD" />
    </linearGradient>

    <!-- 3D Plane Gradients -->
    <linearGradient id="planeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33FFBA" />
      <stop offset="100%" stop-color="#00E599" />
    </linearGradient>
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D287" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    <linearGradient id="planeShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00965F" />
      <stop offset="100%" stop-color="#007046" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
