<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103766" />
      <stop offset="55%" stop-color="#0B2545" />
      <stop offset="100%" stop-color="#051429" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#386B49" />
      <stop offset="100%" stop-color="#2D5A3D" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="60" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="6 4" />

  <!-- Ambient Glow -->
  <circle cx="100" cy="85" r="45" fill="#386B49" opacity="0.15" filter="blur(20px)" />

  <!-- Traveler Silhouette / Avatar Figure -->
  <!-- Head -->
  <circle cx="100" cy="82" r="32" fill="#E2E8F0" />
  
  <!-- Sleek Traveler Cap / Compass Visor Accent -->
  <path d="M72 74 C72 60, 128 60, 128 74 C118 70, 82 70, 72 74 Z" fill="url(#accentGrad)" />
  <circle cx="100" cy="62" r="3" fill="#ffffff" />

  <!-- Shoulders & Body -->
  <path d="M46 166 C46 128, 70 122, 100 122 C130 122, 154 128, 154 166 C140 178, 60 178, 46 166 Z" fill="#CBD5E1" />

  <!-- Traveler Collar / Jacket Detail -->
  <path d="M85 124 L100 148 L115 124" fill="none" stroke="#0B2545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Mini Emerald Compass Star Badge -->
  <circle cx="145" cy="145" r="20" fill="#0B2545" stroke="#386B49" stroke-width="3" />
  <path d="M145 133 L148 142 L157 145 L148 148 L145 157 L142 148 L133 145 L142 142 Z" fill="url(#accentGrad)" />
</svg>
