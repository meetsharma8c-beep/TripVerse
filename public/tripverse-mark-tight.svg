<svg xmlns="http://www.w3.org/2000/svg" viewBox="95 72 670 540" width="100%" height="100%">
  <defs>
    <!-- Brand Vibrant Gradients -->
    <linearGradient id="tvTGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7C59" />
      <stop offset="30%" stop-color="#386B49" />
      <stop offset="70%" stop-color="#2D5A3D" />
      <stop offset="100%" stop-color="#1E3E2B" />
    </linearGradient>

    <linearGradient id="tvSwoopPinGrad" x1="15%" y1="30%" x2="55%" y2="95%">
      <stop offset="0%" stop-color="#558B65" />
      <stop offset="25%" stop-color="#386B49" />
      <stop offset="60%" stop-color="#2D5A3D" />
      <stop offset="100%" stop-color="#152A1C" />
    </linearGradient>

    <!-- 3D Glider Facets -->
    <linearGradient id="pTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#386B49" />
      <stop offset="100%" stop-color="#558B65" />
    </linearGradient>
    <linearGradient id="pMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D5A3D" />
      <stop offset="100%" stop-color="#386B49" />
    </linearGradient>
    <linearGradient id="pBot" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00704A" />
      <stop offset="100%" stop-color="#00965F" />
    </linearGradient>
  </defs>

  <!-- 1. Lower Pin & Orbit Swoop -->
  <path d="undefined" fill="url(#tvSwoopPinGrad)" />

  <!-- 2. Upper T Shape -->
  <path d="tvTGrad" fill="url(#tvTGrad)" />

  <!-- 3. Supersonic 3D Origami Airplane -->
  <g id="origami-glider">
    <!-- Underbody Keel -->
    <polygon points="658,257 647,268 675,333" fill="url(#pBot)" />
    <!-- Bottom Wing -->
    <polygon points="759,178 658,257 675,333" fill="url(#pMid)" />
    <!-- Top Wing -->
    <polygon points="759,178 572,235 658,257" fill="url(#pTop)" />
    <!-- Crisp Spine Line -->
    <line x1="658" y1="257" x2="759" y2="178" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />
  </g>
</svg>